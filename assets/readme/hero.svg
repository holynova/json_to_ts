<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%">
  <title>JS 转 TS — JSON to TypeScript, paste JSON get interfaces</title>
  <desc>Dark developer-tool hero: a JSON object on the left converts through an arrow into an exported TypeScript interface on the right.</desc>
  <defs>
    <linearGradient id="indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <g>
    <rect width="1200" height="440" rx="16" fill="#0b0e17"/>
    <rect width="1200" height="440" rx="16" fill="none" stroke="#1e2436" stroke-width="1.5"/>
  </g>
  <!-- left copy -->
  <g>
    <g>
      <rect x="60" y="52" width="204" height="32" rx="16" fill="#171c2c" stroke="#6366f1" stroke-width="1.2"/>
      <text x="162" y="74" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#a5b4fc">JSON → TS · 开发者工具</text>
    </g>
    <text x="60" y="152" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="800" fill="#f9fafb">JS 转 TS</text>
    <text x="60" y="200" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="24" font-weight="700" fill="#a5b4fc">JSON → TypeScript</text>
    <text x="60" y="244" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" fill="#c7cddb">粘贴 JSON，实时生成类型定义</text>
    <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700">
      <g>
        <rect x="60" y="282" width="150" height="44" rx="10" fill="#171c2c" stroke="#2c3550" stroke-width="1"/>
        <text x="135" y="311" text-anchor="middle" fill="#e5e7eb">实时转换</text>
      </g>
      <g>
        <rect x="226" y="282" width="150" height="44" rx="10" fill="#171c2c" stroke="#2c3550" stroke-width="1"/>
        <text x="301" y="311" text-anchor="middle" fill="#e5e7eb">导出 .d.ts</text>
      </g>
      <g>
        <rect x="392" y="282" width="150" height="44" rx="10" fill="#171c2c" stroke="#2c3550" stroke-width="1"/>
        <text x="467" y="311" text-anchor="middle" fill="#e5e7eb">Mock 数据</text>
      </g>
    </g>
    <text x="60" y="376" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#9aa3b5">顶部导航直达其余 6 个独立工具站</text>
  </g>
  <!-- right: JSON -> TS panels -->
  <g font-family="'SF Mono', Monaco, Consolas, monospace">
    <g transform="translate(600, 64)">
      <rect x="0" y="0" width="236" height="312" rx="12" fill="#131828" stroke="#2c3550" stroke-width="1"/>
      <g>
        <rect x="0" y="0" width="236" height="38" rx="12" fill="#1e2538"/>
        <rect x="0" y="19" width="236" height="19" fill="#1e2538"/>
        <text x="16" y="26" font-size="16" font-weight="700" fill="#fbbf24">JSON 输入</text>
      </g>
      <text x="16" y="76" font-size="17" fill="#e5e7eb">{</text>
      <text x="16" y="104" font-size="17" fill="#e5e7eb">  <tspan fill="#93c5fd">"name"</tspan>: <tspan fill="#fbbf24">"Ada"</tspan>,</text>
      <text x="16" y="132" font-size="17" fill="#e5e7eb">  <tspan fill="#93c5fd">"age"</tspan>: <tspan fill="#f472b6">30</tspan>,</text>
      <text x="16" y="160" font-size="17" fill="#e5e7eb">  <tspan fill="#93c5fd">"tags"</tspan>: [</text>
      <text x="16" y="188" font-size="17" fill="#e5e7eb">    <tspan fill="#fbbf24">"js"</tspan>, <tspan fill="#fbbf24">"ts"</tspan></text>
      <text x="16" y="216" font-size="17" fill="#e5e7eb">  ],</text>
      <text x="16" y="244" font-size="17" fill="#e5e7eb">  <tspan fill="#93c5fd">"admin"</tspan>: <tspan fill="#f472b6">true</tspan></text>
      <text x="16" y="272" font-size="17" fill="#e5e7eb">}</text>
    </g>
    <!-- arrow -->
    <g>
      <rect x="844" y="196" width="40" height="40" fill="#6366f1"/>
      <circle cx="864" cy="216" r="26" fill="url(#indigo)" stroke="#0b0e17" stroke-width="3"/>
      <text x="864" y="224" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">→</text>
    </g>
    <g transform="translate(892, 64)">
      <rect x="0" y="0" width="248" height="312" rx="12" fill="#131828" stroke="#2c3550" stroke-width="1"/>
      <g>
        <rect x="0" y="0" width="248" height="38" rx="12" fill="#1e2538"/>
        <rect x="0" y="19" width="248" height="19" fill="#1e2538"/>
        <text x="16" y="26" font-size="16" font-weight="700" fill="#67e8f9">TypeScript 输出</text>
      </g>
      <text x="16" y="76" font-size="17" fill="#e5e7eb"><tspan fill="#c084fc">export interface</tspan></text>
      <text x="16" y="104" font-size="17" fill="#e5e7eb">RootObject {</text>
      <text x="16" y="132" font-size="17" fill="#e5e7eb">  name: <tspan fill="#fbbf24">string</tspan>;</text>
      <text x="16" y="160" font-size="17" fill="#e5e7eb">  age: <tspan fill="#fbbf24">number</tspan>;</text>
      <text x="16" y="188" font-size="17" fill="#e5e7eb">  tags: <tspan fill="#fbbf24">string[]</tspan>;</text>
      <text x="16" y="216" font-size="17" fill="#e5e7eb">  admin: <tspan fill="#fbbf24">boolean</tspan>;</text>
      <text x="16" y="244" font-size="17" fill="#e5e7eb">}</text>
      <text x="16" y="288" font-size="15" fill="#9aa3b5">// 可下载 index.d.ts</text>
    </g>
  </g>
</svg>
